name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Syntax and feature regression tests
        run: node scripts/check.mjs
      - name: Install isolated SQL test engine
        run: npm install --prefix "$RUNNER_TEMP/lanmao-sql" --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.14
      - name: Database permissions in disposable PostgreSQL
        run: PGLITE_MODULE="file://$RUNNER_TEMP/lanmao-sql/node_modules/@electric-sql/pglite/dist/index.js" node tests/permissions.test.mjs
      - name: Verify production package
        run: node scripts/build.mjs
