name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk lanmaospace.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanmaospace-apk
          path: lanmaospace.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 蓝昴空间 手机版 APK (无谷歌框架)
          body: |
            ### 📱 蓝昴空间 手机版直接下载（无需谷歌框架）
            - 适配华为鸿蒙、小米、OPPO、vivo、荣耀等所有安卓手机；
            - 纯原生 WebView 驱动，零 Google Play 依赖；
            - 下载后直接在手机上点击安装即可。
          files: lanmaospace.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
