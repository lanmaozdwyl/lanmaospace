<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成员空间 | 蓝昴空间</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="space.css"></head><body>
<nav class="space-nav" aria-label="空间导航"><a href="index.html">🐱 Lanmao Space</a><div><a href="space.html" id="my-space">我的空间</a><a href="#members">浏览成员</a><a href="profile.html">设置头像</a><button type="button" data-signout>退出登录</button></div></nav>
<main class="space-shell"><header><p class="space-eyebrow">MEMBER SPACE</p><h1>每个人，都有自己的空间。</h1><p>分享你的介绍、链接与近况。内容仅向登录成员展示。</p></header>
<p id="space-status" role="status" aria-live="polite">正在加载…</p><button type="button" id="reload-space">刷新页面内容</button>
<div id="space-app" hidden><section class="space-card" aria-labelledby="member-name"><div id="member-avatar" class="space-avatar"></div><h2 id="member-name"></h2><p id="member-bio" class="space-text"></p><ul id="member-links"></ul><a id="member-permalink">个人主页直达链接 ↗</a><p id="space-empty" hidden>这个成员尚未完善个人主页。</p></section>
<section id="space-editor" class="space-card" hidden><h2>编辑我的主页</h2><p>保存后，昵称、简介和链接将向其他登录成员展示。头像在“设置头像”里修改。</p><form id="space-form"><label for="space-name">昵称</label><input id="space-name" required maxlength="40" autocomplete="nickname"><label for="space-bio">简介</label><textarea id="space-bio" maxlength="600" rows="4"></textarea><h3>自定义链接</h3><p>最多 6 个，请填写 HTTP/HTTPS 地址。</p><div id="link-editor"></div><button type="submit">保存主页</button></form></section>
<section class="space-card"><h2 id="posts-heading">最近动态</h2><form id="post-form" hidden><label for="post-body">发布新动态</label><textarea id="post-body" required maxlength="2000" rows="4" placeholder="分享你的近况…"></textarea><p>发布后所有登录成员可见，之后可隐藏并恢复。</p><button type="submit">发布动态</button></form><label id="archive-control" hidden><input id="show-archived" type="checkbox"> 查看我已隐藏的动态</label><div id="post-list"></div><div class="space-pager"><button type="button" id="posts-prev">上一页</button><button type="button" id="posts-next">下一页</button></div></section>
<section id="members" class="space-card"><h2>发现成员</h2><p>展示已保存个人主页的成员，按主页更新时间排序。</p><div id="member-list" class="member-grid"></div><div class="space-pager"><button type="button" id="members-prev">上一页</button><button type="button" id="members-next">下一页</button></div></section></div></main>
<script src="memo-config.js"></script><script type="module" src="auth-guard.js"></script><script type="module" src="space.js"></script></body></html>
