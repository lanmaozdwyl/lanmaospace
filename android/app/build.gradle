plugins {
    id 'com.android.application'
}

android {
    namespace 'space.lanmao.app'
    compileSdk 34

    defaultConfig {
        applicationId "space.lanmao.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯原生项目，无任何 Google Play 服务依赖
}
